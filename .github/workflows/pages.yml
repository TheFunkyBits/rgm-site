name: Deploy RGM static site
run-name: Deploy RGM site (${{ inputs['site-commit'] }})

on:
  workflow_dispatch:
    inputs:
      site-commit:
        description: Reviewed site main commit containing only intro, privacy and static resources
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Require reviewed canonical site main commit
        if: github.ref != 'refs/heads/main' || github.repository != 'TheFunkyBits/rgm-site' || github.sha != inputs['site-commit']
        run: exit 1

      - name: Checkout reviewed site commit
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Stage intro and privacy artifact
        run: >-
          python -B .github/scripts/assemble_static_pages.py
          --site-root . --site-commit "$GITHUB_SHA"
          --output "$RUNNER_TEMP/pages-artifact"

      - name: Confirm current site main before Pages upload
        run: >-
          python -B .github/scripts/require_current_site_main.py
          --site-root . --site-commit "$GITHUB_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-artifact

      - name: Confirm current site main before Pages deployment
        run: >-
          python -B .github/scripts/require_current_site_main.py
          --site-root . --site-commit "$GITHUB_SHA"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
